<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-PO MAPPING</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .site-header {
            background-color: #ffffff;
            padding: 10px 24px;
            width: 100%;
            position: relative;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08),
                        0 1px 3px rgba(0, 0, 0, 0.05);
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .left-logo-grp {
            display: flex;
            align-items: center;
            gap: 80px;
        }
        .sidebar-button {
            background: none;
            border: none;
            font-size: 28px;
            color: #333333;
            text-decoration: none;
            cursor: pointer;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
            margin-left: -70px;
        }
        .sidebar-button:hover {
            color: #a30000; 
        }
        .logo-main {
            height: 70px;
            width: auto;
            display: block;
        }
        .logo-trust {
            height: 70px;
            width: auto;
            display: block;
        }
        .sidebar-drawer {
            position: fixed;
            top: 0;
            left: -380px; 
            width: 380px;
            height: 100%;
            background-color: #2d3748;
            z-index: 2000; 
            transition: left 0.3s ease-in-out; 
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.3);
            padding: 24px;
        }
        .sidebar-drawer:target {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333333;
            padding-bottom: 15px;
        }
        .sidebar-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
        }
        .sidebar-close-btn {
            color: #aaaaaa;
            text-decoration: none;
            font-size: 26px;
            font-weight: bold;
            line-height: 1;
        }
        .sidebar-close-btn:hover {
            color: #ffffff;
        }
        .sidebar-menu {
            list-style: none;
        }
        .sidebar-menu li {
            margin-bottom: 15px;
        }
        .sidebar-menu li a {
            color: #dddddd;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px 12px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        .sidebar-menu li a:hover {
            background-color: #a30000; 
            color: #ffffff;
        }
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1500;
            display: none;
        }
        .sidebar-drawer:target ~ .sidebar-overlay {
            display: block;
        }
        @media (max-width: 768px) {
            .logo-main { height: 40px; }
            .logo-trust { height: 45px; }
            .hide-on-mobile { display: none; }
        }
    </style>
</head>
<body>
    <div id="mainSidebar" class="sidebar-drawer">
        <div class="sidebar-header">
            <span class="sidebar-title">Main Navigation</span>
            <a href="#" class="sidebar-close-btn">&times;</a>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#">CO-PO MAPPING</a></li>
        </ul>
    </div>
    <a href="#" class="sidebar-overlay"></a>
    <header class="site-header">
        <div class="header-container">
            <div class="left-logo-grp">
                <a href="#mainSidebar" class="sidebar-button">&#9776;</a>
                <img src="images/svu.png" alt="Somaiya Vidyavihar University" class="logo-main">
                <img src="images/kjsse.png" alt="Somaiya Vidyavihar" class="logo-main hide-on-mobile">  
            </div>
            <div class="right-logo-group">
                <img src="images/trust.png" alt="Somaiya Trust" class="logo-trust">    
            </div>
        </div>
    </header>
    <section class="filter-section">
        <div class="filter-container">

            <div class="form-grp">
                <label for="courseCode">Course Code</label>
                <input type ="text" id="Code" class="form-inp" placeholder="e.g., 16U53G82">
            </div>

            <div class="form-grp">
                <label for="courseTitle">Subject / Course Title</label>
                <input type ="text" id="Title" class="form-inp" placeholder="e.g., Data Structures & Algorithms">
            </div>

            <div class="form-grp">
                <label for="instructor">Faculty Instructor</label>
                <input type="text" id="instructor" class="form-inp" placeholder=" Enter Name">
            </div>

            <div class="form-grp">
                <label for="semester">Academic Year / Semester</label>
                <select id="semester" class="form-inp">
                    <option>First Year (Sem 1 & 2)</option>
                    <option>Second Year (Sem 3 & 4)</option>
                    <option>Third Year (Sem 5 & 6)</option>
                    <option>Fourth Year (Sem 7 & 8)</option>
                </select>
            </div>

        </div>
    </section>

    <div style="background-color: #f8f9fa; height: 100vh; padding: 40px;">
        <p style="margin-top: 10px; color: #555;"></p>
    </div>
    
    
</body>
</html>
