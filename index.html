<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-PO MAPPING</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="mainSidebar" class="sidebar-drawer">
        <div class="sidebar-header">
            <span class="sidebar-title">Main Navigation</span>
            <a href="#" class="sidebar-close-btn">&times;</a>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#">CO-PO MAPPING</a></li>
        </ul>
    </div>
    <a href="#" class="sidebar-overlay"></a>
    <header class="site-header">
        <div class="header-container">
            <div class="left-logo-grp">
                <a href="#mainSidebar" class="sidebar-button">&#9776;</a>
                <img src="images/svu.png" alt="Somaiya Vidyavihar University" class="logo">
                <img src="images/kjsse.png" alt="Somaiya Vidyavihar" class="logo hide-on-mobile">  
            </div>
            <div class="right-logo-group">
                <img src="images/trust.png" alt="Somaiya Trust" class="logo">    
            </div>
        </div>
    </header>
    <section class="filter-section">
        <div class="filter-container">

            <div class="form-grp">
                <label for="courseCode">Course Code</label>
                <input type ="text" id="Code" class="form-inp" placeholder="e.g., 16U53G82">
            </div>

            <div class="form-grp">
                <label for="courseTitle">Subject / Course Title</label>
                <input type ="text" id="Title" class="form-inp" placeholder="e.g., Data Structures & Algorithms">
            </div>

            <div class="form-grp">
                <label for="instructor">Faculty Instructor</label>
                <input type="text" id="instructor" class="form-inp" placeholder=" Enter Name">
            </div>

            <div class="form-grp">
                <label for="semester">Academic Year / Semester</label>
                <select id="semester" class="form-inp">
                    <option>First Year (Sem 1 & 2)</option>
                    <option>Second Year (Sem 3 & 4)</option>
                    <option>Third Year (Sem 5 & 6)</option>
                    <option>Fourth Year (Sem 7 & 8)</option>
                </select>
            </div>

        </div>
    </section>
    
    
</body>
</html>
