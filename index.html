<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-PO MAPPING</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="design-tokens.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
    </style>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
</head>
<body>
    <div id="mainSidebar" class="sidebar-drawer">
        <div class="sidebar-header">
            <span class="sidebar-title">Navigation Bar</span>
            <a href="#" class="sidebar-close-btn">&times;</a>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#">CO-PO MAPPING</a></li>
        </ul>
    </div>
    <a href="#" class="sidebar-overlay"></a>
    <header class="site-header">
        <div class="header-container">
            <div class="left-logo-grp">
                <a href="#mainSidebar" class="sidebar-button">&#9776;</a>
                <img src="images/svu.png" alt="Somaiya Vidyavihar University" class="logo">
                <img src="images/kjsse.png" alt="Somaiya Vidyavihar" class="logo hide-on-mobile">  
            </div>
            <div class="right-logo-group">
                <img src="images/trust.png" alt="Somaiya Trust" class="logo">    
            </div>
        </div>
    </header>
    <section class="filter-section">
        <div class="filter-container">

            <div class="form-grp">
                <button class="btn btn-primary" data-tippy-content="Click and upload syllabus pdf to parse the syllabus with AI to automatically input CO, PO, and PSO.">AI Parse Syllabus</button>
            </div>
            <div class="form-grp">
                <label for="courseCode">Course Code</label>
                <select id="courseCode" class="form-inp">
                    <option>--Course Codes--</option>
                </select>
            </div>

            <div class="form-grp">
                <label for="courseTitle">Course Title</label>
                <select id="courseTitle" class="form-inp">
                    <option>--Course Titles--</option>
                </select>
            </div>

            <div class="form-grp">
                <label for="instructor">Faculty Name</label>
                <input type="text" id="instructor" class="form-inp" placeholder=" Enter Name">
            </div>

            <div class="form-grp">
                <label for="semester">Semester</label>
                <select id="semester" class="form-inp">
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select>
            </div>

        </div>
    </section>

    <section class="matrix-section">
        <div class="matrix-container">
            <div class="col-item outcome-entry">
                <div class="tab-headers">
                    <button class="tab-link active" data-tab="co-mapping">COs  <span id="co-count" class="o-count badge badge-primary">0</span></button>
                    <button class="tab-link" data-tab="po-mapping">POs  <span id="po-count" class="o-count badge badge-primary">0</span></button>
                    <button class="tab-link" data-tab="pso-mapping">PSOs  <span id="pso-count" class="o-count badge badge-primary">0</span></button>
                </div>

                <div class="tab-body">
                    <div id="co-mapping" class="tab-pane active">
                        <div class="action-buttons">
                            <button class="btn btn-success" id="add-co-btn" onclick="addCO()"><img class="action-btn-icon" src="images/addO.png" alt="Add CO"> Add CO</button>
                            <button class="btn btn-danger" id="delete-co-btn" onclick="deleteLastCO()"><img class="action-btn-icon" src="images/delO.png" alt="Delete CO"> Delete CO</button>
                        </div>
                        <div id="co-mapping-list"></div>
                    </div>
                    <div id="po-mapping" class="tab-pane">
                        <div class="action-buttons">
                            <button class="btn btn-success" id="add-po-btn" onclick="addPO()"><img class="action-btn-icon" src="images/addO.png" alt="Add PO"> Add PO</button>
                            <button class="btn btn-danger" id="delete-po-btn" onclick="deleteLastPO()"><img class="action-btn-icon" src="images/delO.png" alt="Delete PO"> Delete PO</button>
                        </div>
                        <div id="po-mapping-list"></div>
                    </div>
                    <div id="pso-mapping" class="tab-pane">
                        <div class="action-buttons">
                            <button class="btn btn-success" id="add-pso-btn" onclick="addPSO()"><img class="action-btn-icon" src="images/addO.png" alt="Add PSO"> Add PSO</button>
                            <button class="btn btn-danger" id="delete-pso-btn" onclick="deleteLastPSO()"><img class="action-btn-icon" src="images/delO.png" alt="Delete PSO"> Delete PSO</button>
                        </div>
                        <div id="pso-mapping-list"></div>
                    </div>
                </div>
                
            </div>
            <div class="col-item outcome-mapping">
                <div class="mapping-matrix-header">
                    <h3></h3>
                    <div class="matrix-actions">
                        <button class="btn btn-primary"><img class="action-btn-icon" src="images/importCsv.png" alt="Import CSV">  Import CSV</button>
                        <button class="btn btn-primary"><img class="action-btn-icon" src="images/exportCsv.png" alt="Export CSV">  Export CSV</button>
                    </div>
                </div>

                <div class="matrix-table">
                    <table class="mapping-matrix" id="matrixTable">
                        <thead>
                            <tr id="matrixHeadRow1">
                                <th rowspan="2" class="sticky-col col-co-heading">Course Outcomes</th>
                                </tr>
                            <tr id="matrixHeadRow2">
                                </tr>
                        </thead>
                        <tbody id="matrixBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
    
</body>

    <script src="script.js" defer></script>

</html>
