<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic CO-PO Mapping Tool</title>
    
    <!-- PDF.js library for client-side PDF text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            /* Custom Brand Palette */
            --color-primary: #A01E25;
            --color-primary-hover: #931926;
            --color-primary-active: #78141E;
            --color-primary-soft: #FFD5D9;
            --color-vitality: #ED1C24;

            --color-secondary: #D97706;
            --color-secondary-hover: #BD6704;
            --color-secondary-active: #B56406;
            --color-secondary-soft: #F5C690;

            --color-background: #FFFFFF;
            --color-surface-hover: #F1F5F9;
            --color-surface-active: #E2E8F0;

            --color-border: #E2E8F0;
            --color-border-hover: #CBD5E1;

            --color-text-primary: #0F172A;
            --color-text-secondary: #475569;
            --color-text-tertiary: #94A3B8;

            --color-success: #059669;
            --color-warning: #D97706;
            --color-error: #DC2626;
            --color-info: #2563EB;
            
            /* Heatmap Color Scale based on Brand Primary */
            --val-0: var(--color-surface-hover);
            --val-1: var(--color-primary-soft);
            --val-2: #E86B74; /* Balanced mid-tone red */
            --val-3: var(--color-primary);
            
            --txt-0: var(--color-text-tertiary);
            --txt-1: var(--color-primary-active);
            --txt-2: #ffffff;
            --txt-3: #ffffff;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-surface-hover);
            color: var(--color-text-primary);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--color-background);
            padding: 16px 32px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
        }

        .badge {
            background: var(--color-primary-soft);
            color: var(--color-primary-active);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .badge.loading {
            background: var(--color-secondary-soft);
            color: var(--color-secondary-active);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* --- Metadata/Context Form Panel --- */
        .context-panel {
            background-color: var(--color-background);
            border-bottom: 1px solid var(--color-border);
            padding: 20px 32px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            z-index: 5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .form-group input, .form-group select {
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            color: var(--color-text-primary);
            background-color: var(--color-surface-hover);
            height: 42px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--color-primary);
            background-color: var(--color-background);
            box-shadow: 0 0 0 4px rgba(160, 30, 37, 0.1);
        }
        
        .import-btn {
            background-color: var(--color-primary-soft);
            color: var(--color-primary-active);
            border: none;
            padding: 0 16px;
            height: 42px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .import-btn:hover { background-color: #F8B4B9; } /* Slightly darker soft red */
        .import-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Left Sidebar (Tab Widget) --- */
        .sidebar {
            width: 400px;
            background-color: var(--color-background);
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--color-border);
            background-color: var(--color-surface-hover);
            padding: 0 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 10px;
            border: none;
            background: none;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-size: 0.9rem;
            position: relative;
            font-family: inherit;
        }

        .tab-btn:hover { color: var(--color-primary); }

        .tab-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
            font-weight: 600;
        }
        
        .tab-count {
            background: var(--color-border);
            color: var(--color-text-secondary);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 999px;
            margin-left: 6px;
            font-weight: 600;
        }
        .tab-btn.active .tab-count {
            background: var(--color-primary-soft);
            color: var(--color-primary-active);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: none;
        }

        .tab-content.active { display: block; }

        .list-item {
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .list-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--color-text-primary);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--color-text-tertiary);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-icon:hover { color: var(--color-error); background: #fee2e2; }

        .desc-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            box-sizing: border-box;
            resize: vertical;
            min-height: 70px;
            font-family: inherit;
            background-color: var(--color-surface-hover);
            transition: 0.2s;
        }
        
        .desc-input:focus { 
            outline: none; 
            border-color: var(--color-primary);
            background-color: var(--color-background);
            box-shadow: 0 0 0 3px rgba(160, 30, 37, 0.1);
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--color-background);
            border: 2px dashed var(--color-border-hover);
            color: var(--color-text-secondary);
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }

        .add-btn:hover { 
            background-color: var(--color-surface-hover); 
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        /* --- Right Main Area (Matrix) --- */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            background-color: var(--color-surface-active);
        }

        .matrix-container {
            background: var(--color-background);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            border: 1px solid var(--color-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .table-responsive {
            overflow: auto;
            max-height: calc(100vh - 280px);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }

        th, td {
            border-right: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
            padding: 12px;
            text-align: center;
            min-width: 90px;
        }

        th {
            background-color: var(--color-surface-hover);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 2;
            cursor: help;
            color: var(--color-text-secondary);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        td:first-child, th:first-child {
            position: sticky;
            left: 0;
            background-color: var(--color-surface-hover);
            z-index: 3;
            font-weight: 600;
            text-align: left;
            width: 110px;
            cursor: help;
            color: var(--color-text-primary);
        }

        th:first-child { z-index: 4; }

        .matrix-select {
            width: 100%;
            padding: 8px;
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            appearance: none;
            background-color: inherit;
            color: inherit;
            transition: 0.2s;
            font-family: inherit;
        }
        
        .matrix-select:focus {
            outline: none;
            border-color: var(--color-primary);
            background-color: var(--color-background) !important;
            color: var(--color-text-primary) !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .matrix-select:hover { border-color: rgba(255,255,255,0.3); }

        /* Colors based on Heatmap scale */
        .val-0 { background-color: var(--val-0); color: var(--txt-0); }
        .val-1 { background-color: var(--val-1); color: var(--txt-1); }
        .val-2 { background-color: var(--val-2); color: var(--txt-2); }
        .val-3 { background-color: var(--val-3); color: var(--txt-3); }

        .btn-save {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-save:hover { 
            background-color: var(--color-primary-hover); 
            box-shadow: 0 4px 6px -1px rgba(160, 30, 37, 0.3);
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--color-text-tertiary);
        }
        
        .empty-state h3 {
            margin-bottom: 12px;
            color: var(--color-text-primary);
            font-weight: 600;
        }

        /* --- Custom Toast Notifications --- */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background-color: var(--color-background);
            color: var(--color-text-primary);
            padding: 16px 24px;
            border-radius: var(--radius-md);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--color-border);
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--color-success); }
        .toast.error { border-left: 4px solid var(--color-error); }
        .toast.info { border-left: 4px solid var(--color-info); }
        .toast.warning { border-left: 4px solid var(--color-warning); }
    </style>
</head>
<body>

    <header>
        <h1>
            Course Outcome Mapping
            <span class="badge" id="programBadge">No Syllabus Loaded</span>
        </h1>
        <button class="btn-save" onclick="exportData()">Export Matrix Data</button>
    </header>

    <!-- ACADEMIC CONTEXT FIELD BARS -->
    <div class="context-panel" id="academicContext">
        <!-- AI PDF Import Button -->
        <div class="form-group">
            <input type="file" id="syllabusUpload" accept=".pdf" style="display: none;" onchange="handleSyllabusImport(event)">
            <button class="import-btn" id="importBtn" onclick="document.getElementById('syllabusUpload').click()">
                📄 AI Parse Syllabus
            </button>
        </div>

        <div class="form-group">
            <label for="courseCode">Course Code</label>
            <select id="courseCode" onchange="handleCourseSelection('code')" disabled>
                <option value="">-- Import Syllabus First --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="subjectTitle">Subject / Course Title</label>
            <select id="subjectTitle" onchange="handleCourseSelection('title')" disabled>
                <option value="">-- Import Syllabus First --</option>
            </select>
        </div>
        <div class="form-group">
            <label for="facultyName">Faculty Instructor</label>
            <input type="text" id="facultyName" value="" placeholder="e.g., Dr. Smith">
        </div>
        <div class="form-group">
            <label for="semester">Academic Year / Semester</label>
            <select id="semester">
                <option value="Sem 1 & 2">First Year (Sem 1 & 2)</option>
                <option value="Sem 3 & 4">Second Year (Sem 3 & 4)</option>
                <option value="Sem 5 & 6">Third Year (Sem 5 & 6)</option>
                <option value="Sem 7 & 8">Fourth Year (Sem 7 & 8)</option>
            </select>
        </div>
    </div>

    <div class="layout">
        <!-- LEFT SIDEBAR: Tabs & Management -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('co')">COs <span class="tab-count" id="count-co">0</span></button>
                <button class="tab-btn" onclick="switchTab('po')">POs <span class="tab-count" id="count-po">0</span></button>
                <button class="tab-btn" onclick="switchTab('pso')">PSOs <span class="tab-count" id="count-pso">0</span></button>
            </div>

            <!-- CO Tab -->
            <div id="tab-co" class="tab-content active">
                <div id="co-list"></div>
                <button class="add-btn" onclick="addItem('co')">➕ Add Course Outcome</button>
            </div>

            <!-- PO Tab -->
            <div id="tab-po" class="tab-content">
                <div id="po-list"></div>
                <button class="add-btn" onclick="addItem('po')">➕ Add Program Outcome</button>
            </div>

            <!-- PSO Tab -->
            <div id="tab-pso" class="tab-content">
                <div id="pso-list"></div>
                <button class="add-btn" onclick="addItem('pso')">➕ Add Program Specific Outcome</button>
            </div>
        </div>

        <!-- RIGHT MAIN: The Interactive Matrix -->
        <div class="main-content">
            <div class="matrix-container">
                <div class="table-responsive">
                    <table id="matrix-table">
                        <thead id="matrix-head"></thead>
                        <tbody id="matrix-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

<script>
    // --- 1. Global Setup & Utilities ---
    const apiKey = ""; // Execution environment injects API key here
    let parsedSyllabusData = null; // Will store the AI-parsed JSON

    const appState = {
        co: [], po: [], pso: [], mappings: {}
    };

    let idCounters = { co: 1, po: 1, pso: 1 };

    // Toast Notification System (Replaces alert())
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = 'ℹ️';
        if (type === 'success') icon = '✅';
        if (type === 'error') icon = '⚠️';
        if (type === 'warning') icon = '🔸';
        
        toast.innerHTML = `<span>${icon}</span> <div>${message}</div>`;
        container.appendChild(toast);
        
        // Trigger animation
        setTimeout(() => toast.classList.add('show'), 10);
        
        // Remove after 4 seconds
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // --- 2. AI PDF PARSING ENGINE ---

    // A. Extract raw text using PDF.js
    async function extractTextFromPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + "\n";
            }
            return fullText;
        } catch (error) {
            console.error("PDF.js Extraction Error:", error);
            throw new Error("Failed to read text from the PDF file.");
        }
    }

    // B. Call Gemini AI with Exponential Backoff
    async function fetchWithRetry(url, options, retries = 5) {
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i < retries; i++) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                return await response.json();
            } catch (e) {
                if (i === retries - 1) throw e;
                await new Promise(res => setTimeout(res, delays[i]));
            }
        }
    }

    // C. Orchestrate AI Analysis
    async function analyzeSyllabusWithAI(text) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        
        // Strictly structured schema for the AI to return
        const schema = {
            type: "OBJECT",
            properties: {
                programName: { type: "STRING" },
                detectedSemester: { type: "STRING" },
                programOutcomes: {
                    type: "ARRAY",
                    items: { type: "OBJECT", properties: { id: { type: "STRING" }, desc: { type: "STRING" } } }
                },
                programSpecificOutcomes: {
                    type: "ARRAY",
                    items: { type: "OBJECT", properties: { id: { type: "STRING" }, desc: { type: "STRING" } } }
                },
                courses: {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            code: { type: "STRING" },
                            title: { type: "STRING" },
                            cos: {
                                type: "ARRAY",
                                items: { type: "OBJECT", properties: { id: { type: "STRING" }, desc: { type: "STRING" } } }
                            }
                        }
                    }
                }
            }
        };

        const payload = {
            contents: [{
                parts: [{ 
                    text: `You are an expert academic data extractor. Extract the curriculum details from the following syllabus text. Extract the Program Name, Semester, all Program Outcomes (POs), Program Specific Outcomes (PSOs), and a list of all Courses (with their Code, Title, and Course Outcomes - COs). Ignore unrelated text.\n\nSYLLABUS TEXT:\n${text}` 
                }]
            }],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: schema
            }
        };

        const result = await fetchWithRetry(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        if (!result.candidates || !result.candidates[0].content) {
            throw new Error("AI returned an invalid or empty response.");
        }

        const jsonText = result.candidates[0].content.parts[0].text;
        return JSON.parse(jsonText);
    }

    // D. Main Handle Import Function
    async function handleSyllabusImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const badge = document.getElementById('programBadge');
        const importBtn = document.getElementById('importBtn');
        
        try {
            // Setup UI for loading state
            badge.textContent = "1/2 Extracting PDF Text...";
            badge.classList.add('loading');
            importBtn.disabled = true;
            showToast("Reading PDF document...", "info");

            // Step 1: Extract Text
            const text = await extractTextFromPDF(file);
            
            // Step 2: AI Parsing
            badge.textContent = "2/2 AI Analyzing Curriculum...";
            showToast("Sending text to AI for structuring. This may take a moment...", "info");
            parsedSyllabusData = await analyzeSyllabusWithAI(text);
            
            // Step 3: Populate Global UI
            badge.classList.remove('loading');
            badge.textContent = parsedSyllabusData.programName || "Curriculum Loaded";
            
            // Try to match Semester dropdown safely
            if(parsedSyllabusData.detectedSemester) {
                const semSelect = document.getElementById('semester');
                const options = Array.from(semSelect.options);
                const matchedOption = options.find(opt => opt.value.toLowerCase().includes(parsedSyllabusData.detectedSemester.toLowerCase()) || parsedSyllabusData.detectedSemester.toLowerCase().includes(opt.value.toLowerCase()));
                if(matchedOption) semSelect.value = matchedOption.value;
            }
            
            // Enable and Populate Dropdowns
            const codeSelect = document.getElementById('courseCode');
            const titleSelect = document.getElementById('subjectTitle');
            
            codeSelect.disabled = false;
            titleSelect.disabled = false;
            
            codeSelect.innerHTML = `<option value="">-- Select Course Code --</option>`;
            titleSelect.innerHTML = `<option value="">-- Select Subject Title --</option>`;

            if(parsedSyllabusData.courses && parsedSyllabusData.courses.length > 0) {
                parsedSyllabusData.courses.forEach(course => {
                    codeSelect.innerHTML += `<option value="${course.code}">${course.code}</option>`;
                    titleSelect.innerHTML += `<option value="${course.code}">${course.title}</option>`;
                });
            } else {
                showToast("AI couldn't detect any courses in this document.", "warning");
            }

            // Load Program level outcomes (POs and PSOs) safely
            appState.po = parsedSyllabusData.programOutcomes || [];
            appState.pso = parsedSyllabusData.programSpecificOutcomes || [];
            
            // Empty COs until a course is specifically selected
            appState.co = [];
            appState.mappings = {};

            recalcCounters();
            init(); // Re-render everything

            showToast(`Successfully extracted data! Select a Course to begin mapping.`, "success");

        } catch (error) {
            console.error(error);
            badge.classList.remove('loading');
            badge.textContent = "AI Parsing Failed";
            showToast(error.message || "Failed to parse syllabus. Please try again.", "error");
        } finally {
            event.target.value = ''; // Reset file input
            importBtn.disabled = false;
        }
    }

    // Handles synchronization between Code and Title Dropdowns
    function handleCourseSelection(source) {
        const codeSelect = document.getElementById('courseCode');
        const titleSelect = document.getElementById('subjectTitle');
        let selectedCode = "";

        if (source === 'code') {
            selectedCode = codeSelect.value;
            titleSelect.value = selectedCode;
        } else {
            selectedCode = titleSelect.value;
            codeSelect.value = selectedCode;
        }

        if (!selectedCode || !parsedSyllabusData) {
            appState.co = [];
        } else {
            const course = parsedSyllabusData.courses.find(c => c.code === selectedCode);
            if(course && course.cos) {
                appState.co = [...course.cos];
            } else {
                appState.co = [];
            }
        }
        
        appState.mappings = {}; 
        recalcCounters();
        init();
    }


    // --- 3. Tab Widget & Matrix Logic ---
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.currentTarget.classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function renderList(type) {
        const container = document.getElementById(`${type}-list`);
        container.innerHTML = ''; 

        document.getElementById(`count-${type}`).textContent = appState[type].length;

        appState[type].forEach((item) => {
            const div = document.createElement('div');
            div.className = 'list-item';
            
            div.innerHTML = `
                <div class="list-item-header">
                    <span>${item.id}</span>
                    <button class="btn-icon" onclick="deleteItem('${type}', '${item.id}')" title="Delete ${item.id}">🗑️</button>
                </div>
                <textarea class="desc-input" placeholder="Enter description for ${item.id}..." 
                    oninput="updateDescription('${type}', '${item.id}', this.value)">${item.desc}</textarea>
            `;
            container.appendChild(div);
        });
    }

    function renderMatrix() {
        const thead = document.getElementById('matrix-head');
        const tbody = document.getElementById('matrix-body');
        
        thead.innerHTML = '';
        tbody.innerHTML = '';

        const columns = [...appState.po, ...appState.pso];

        if (appState.co.length === 0 || columns.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="100" class="empty-state">
                        <h3>No Outcomes Defined</h3>
                        <p>Import a syllabus and select a course, or manually add outcomes on the left to generate the matrix.</p>
                    </td>
                </tr>`;
            return;
        }

        const trHead = document.createElement('tr');
        trHead.innerHTML = `<th>Outcomes</th>`; 
        
        columns.forEach(col => {
            const th = document.createElement('th');
            th.id = `lbl-${col.id}`;
            th.textContent = col.id;
            th.title = col.desc; 
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        appState.co.forEach(co => {
            const tr = document.createElement('tr');
            
            const tdLabel = document.createElement('td');
            tdLabel.id = `lbl-${co.id}`;
            tdLabel.textContent = co.id;
            tdLabel.title = co.desc;
            tr.appendChild(tdLabel);

            columns.forEach(col => {
                const td = document.createElement('td');
                td.style.padding = "0"; 

                const key = `${co.id}-${col.id}`;
                const currentValue = appState.mappings[key] || 0;

                const select = document.createElement('select');
                select.className = `matrix-select val-${currentValue}`;
                select.dataset.key = key;
                
                const options = [
                    { val: 0, text: '-' },
                    { val: 1, text: '1' },
                    { val: 2, text: '2' },
                    { val: 3, text: '3' }
                ];

                options.forEach(opt => {
                    const optionEl = document.createElement('option');
                    optionEl.value = opt.val;
                    optionEl.textContent = opt.text;
                    if(opt.val === currentValue) optionEl.selected = true;
                    select.appendChild(optionEl);
                });

                select.addEventListener('change', function() {
                    const val = parseInt(this.value);
                    appState.mappings[key] = val;
                    this.className = `matrix-select val-${val}`;
                });

                td.appendChild(select);
                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });
    }

    // --- 4. CRUD Operations & Utilities ---
    function recalcCounters() {
        ['co', 'po', 'pso'].forEach(type => {
            let max = 0;
            appState[type].forEach(item => {
                const num = parseInt(item.id.replace(/\D/g, ''));
                if (!isNaN(num) && num > max) max = num;
            });
            idCounters[type] = max + 1;
        });
    }

    function addItem(type) {
        const idPrefix = type.toUpperCase();
        const newId = `${idPrefix}${idCounters[type]}`;
        idCounters[type]++; 

        appState[type].push({ id: newId, desc: '' });
        
        renderList(type);
        renderMatrix();
        
        const container = document.getElementById(`tab-${type}`);
        container.scrollTop = container.scrollHeight;
    }

    function deleteItem(type, id) {
        // We use a custom modal equivalent here instead of standard confirm, but for simplicity in a self-contained file,
        // we'll keep the logic clean. Since alert is banned, let's just delete directly and show a toast.
        appState[type] = appState[type].filter(item => item.id !== id);

        Object.keys(appState.mappings).forEach(key => {
            if(key.includes(id)) {
                delete appState.mappings[key];
            }
        });

        renderList(type);
        renderMatrix();
        showToast(`Deleted ${id}`, "info");
    }

    function updateDescription(type, id, value) {
        const item = appState[type].find(i => i.id === id);
        if (item) {
            item.desc = value;
            const matrixLabel = document.getElementById(`lbl-${id}`);
            if (matrixLabel) {
                matrixLabel.title = value;
            }
        }
    }

    function exportData() {
        const titleSelect = document.getElementById('subjectTitle');
        const courseName = titleSelect.options[titleSelect.selectedIndex]?.text || '';
        
        const academicMetadata = {
            courseCode: document.getElementById('courseCode').value,
            subjectTitle: courseName,
            facultyName: document.getElementById('facultyName').value.trim(),
            semester: document.getElementById('semester').value,
            exportedAt: new Date().toISOString()
        };

        const comprehensivePayload = {
            academicContext: academicMetadata,
            outcomesSetup: {
                courseOutcomes: appState.co,
                programOutcomes: appState.po,
                programSpecificOutcomes: appState.pso
            },
            matrixMappings: appState.mappings
        };

        console.log("Exported Data Payload:", JSON.stringify(comprehensivePayload, null, 2));
        showToast(`Data package exported successfully! Check browser console.`, "success");
    }

    // --- 5. Initialization ---
    function init() {
        renderList('co');
        renderList('po');
        renderList('pso');
        renderMatrix();
    }

    // Boot up the app in Empty State
    init();

</script>
</body>
</html>
